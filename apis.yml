name: Alan
description: 'Alan is a French digital health insurance and healthcare company that combines
  health insurance (mutuelle / complementary health), preventive care, and daily health
  support in a single app. It serves businesses of every size (from independent contractors and
  very small companies to large enterprises) and individuals such as the self-employed, retirees,
  and civil servants across France. Alan offers fast reimbursements (90% processed within 24 hours),
  a 24/7 chat clinic (Clinique Alan) staffed by healthcare professionals, mental health support,
  eyewear coverage, and an HR-facing platform for administering employee health plans. It reports
  over one million members and 41,000+ companies. This API Evangelist profile was surfaced from the
  Index Ventures portfolio; Alan does not currently publish a public developer API.'
